defaults:
  - model: moment
  - experiment: router_timepeft_8h
  - _self_

paths:
  data: data
  artifacts: artifacts/router-timepeft-8h
  cache: .cache/huggingface

device: cuda
model:
  adapter_implementation: paper_count_inferred
  frequency_top_k: 3
  adapter_dropout: 0.1
  head_dropout: 0.1
  source_head_checkpoint: artifacts/router-timepeft-8h/checkpoints/source-head-h{horizon}.pt
  allow_random_head: false

source_head:
  dataset: Electricity
  require_provenance: true
  output_pattern: source-head-h{horizon}.pt
  training:
    updates: 2000
    batch_size: 1
    validation_windows: 16
    validation_interval: 100
    learning_rate: 0.001
    weight_decay: 0.01
    gradient_clip: 1.0
    bf16: true
    seed: 0

correlation:
  max_lag: 8
  minimum_relative_benefit: 0.002
  probability_threshold: 0.5
  noninferiority_margin: 0.01
  regularization_c: 1.0
  max_iter: 1000
  random_state: 17
  bootstrap_samples: 10000
  bootstrap_seed: 20260804
  bootstrap_confidence_level: 0.95
  random_control_repeats: 1000
  frequency_features:
    - residual_lag1_signed_autocorrelation
    - residual_lag1_abs_autocorrelation
    - residual_mean_signed_autocorrelation
    - residual_mean_abs_autocorrelation
    - residual_max_abs_autocorrelation
    - residual_autocorrelation_nonstationarity
    - residual_autocorrelation_decay
  channel_features:
    - residual_mean_signed_channel_correlation
    - residual_mean_abs_channel_correlation
    - residual_channel_correlation_dispersion
    - residual_correlation_nonstationarity
    - residual_correlation_effective_rank
    - residual_correlation_effective_rank_fraction
    - residual_max_lagged_cross_correlation

claim:
  implementation_label: paper-specified Time-PEFT reimplementation (count-inferred)
  official_code_verified: false
  evidence_scope: preliminary post-hoc eight-hour episodic development screen
  note: >-
    The horizon and routing protocol were finalized after inspecting conventional
    development results and an earlier router pilot, while the dataset set covers
    all 13 paper datasets. Treat this run as exploratory evidence and preregister
    an untouched protocol before any confirmatory routing claim.

hydra:
  job:
    chdir: false
